<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consumindo a API Escolar</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { margin: 5px; padding: 10px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>Testando a API - Entidade: Alunos</h2>
    
    <button onclick="buscarAlunos()">1. Listar Alunos (GET)</button>
    <button onclick="criarAluno()">2. Criar Novo Aluno (POST)</button>
    <button onclick="atualizarAluno(1)">3. Atualizar Aluno ID 1 (PUT)</button>
    <button onclick="deletarAluno(1)">4. Deletar Aluno ID 1 (DELETE)</button>

    <h3>Resultado:</h3>
    <pre id="resultado">Aguardando ação...</pre>

    <script>
        const API_URL = 'http://localhost:3000';
        const telaResultado = document.getElementById('resultado');

        // FUNÇÃO: GET (Listar)
        async function buscarAlunos() {
            try {
                const resposta = await fetch(`${API_URL}/alunos`);
                const dados = await resposta.json();
                telaResultado.innerText = JSON.stringify(dados, null, 2);
            } catch (erro) {
                telaResultado.innerText = "Erro ao conectar com a API.";
            }
        }

        // FUNÇÃO: POST (Criar)
        async function criarAluno() {
            // Objeto com 5 atributos (o ID será gerado no backend)
            const novoAluno = { 
                nome: "Ana Carolina", 
                idade: 22, 
                matricula: "202302", 
                email: "ana@email.com", 
                curso: "Design" 
            };

            const resposta = await fetch(`${API_URL}/alunos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(novoAluno)
            });
            const dados = await resposta.json();
            telaResultado.innerText = "ALUNO CRIADO:\n" + JSON.stringify(dados, null, 2);
        }

        // FUNÇÃO: PUT (Atualizar)
        async function atualizarAluno(id) {
            const dadosAtualizados = { 
                nome: "João Silva (Atualizado)", 
                idade: 21, 
                matricula: "202301", 
                email: "joaosilva_novo@email.com", 
                curso: "Engenharia de Software" 
            };

            const resposta = await fetch(`${API_URL}/alunos/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosAtualizados)
            });
            
            if(resposta.ok) {
                const dados = await resposta.json();
                telaResultado.innerText = "ALUNO ATUALIZADO:\n" + JSON.stringify(dados, null, 2);
            } else {
                telaResultado.innerText = "Erro: Aluno não encontrado.";
            }
        }

        // FUNÇÃO: DELETE (Deletar)
        async function deletarAluno(id) {
            const resposta = await fetch(`${API_URL}/alunos/${id}`, { 
                method: 'DELETE' 
            });
            
            if (resposta.ok) {
                telaResultado.innerText = `SUCESSO: Aluno com ID ${id} foi deletado.\n\nClique em "Listar Alunos (GET)" para verificar.`;
            } else {
                telaResultado.innerText = "Erro: Aluno não encontrado para deletar.";
            }
        }
    </script>
</body>
</html>
