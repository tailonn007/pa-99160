<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema Completo: Clientes, Motos e Carros</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        h1 { text-align: center; color: #333; }
        
        /* Container para colocar os 3 blocos lado a lado */
        .container { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
        
        /* Estilo de cada bloco (Cliente, Moto, Carro) */
        .bloco { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 320px; }
        .bloco h3 { text-align: center; margin-top: 0; color: #444; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        
        /* Estilos do formulário */
        .formulario input { display: block; margin-bottom: 10px; width: 90%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; cursor: pointer; background-color: #007BFF; color: white; border: none; border-radius: 4px; font-weight: bold; margin-bottom: 20px; }
        button:hover { background-color: #0056b3; }
        
        /* Estilos da lista */
        ul { list-style-type: none; padding: 0; }
        li { background: #eee; margin-bottom: 8px; padding: 10px; border-radius: 4px; font-size: 14px; word-wrap: break-word; }
    </style>
</head>
<body>

    <h1>Sistema de Cadastros</h1>

    <div class="container">
        
        <div class="bloco">
            <h3>Clientes</h3>
            <div class="formulario">
                <input type="text" id="clienteId" placeholder="ID (ex: 1)">
                <input type="text" id="clienteNome" placeholder="Nome Completo">
                <input type="text" id="clienteCpf" placeholder="CPF">
                <input type="text" id="clienteEmail" placeholder="E-mail">
                <input type="text" id="clienteTelefone" placeholder="Telefone">
                <button onclick="adicionarCliente()">Salvar Cliente</button>
            </div>
            <h4>Lista de Clientes</h4>
            <ul id="listaClientes"></ul>
        </div>

        <div class="bloco">
            <h3>Motos</h3>
            <div class="formulario">
                <input type="text" id="motoId" placeholder="ID (ex: 1)">
                <input type="text" id="motoMarca" placeholder="Marca">
                <input type="text" id="motoModelo" placeholder="Modelo">
                <input type="text" id="motoCilindradas" placeholder="Cilindradas (ex: 500)">
                <input type="text" id="motoCor" placeholder="Cor">
                <button onclick="adicionarMoto()" style="background-color: #28a745;">Salvar Moto</button>
            </div>
            <h4>Lista de Motos</h4>
            <ul id="listaMotos"></ul>
        </div>

        <div class="bloco">
            <h3>Carros</h3>
            <div class="formulario">
                <input type="text" id="carroId" placeholder="ID (ex: 1)">
                <input type="text" id="carroMarca" placeholder="Marca">
                <input type="text" id="carroModelo" placeholder="Modelo">
                <input type="text" id="carroAno" placeholder="Ano">
                <input type="text" id="carroPlaca" placeholder="Placa">
                <button onclick="adicionarCarro()" style="background-color: #ffc107; color: black;">Salvar Carro</button>
            </div>
            <h4>Lista de Carros</h4>
            <ul id="listaCarros"></ul>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
